<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">

                    <th>Meal</th>

        </thead>

            <tr>
                <td rowspan="2">Monday</td>
                <td>breakfast</td>
                <td>food</td>
            </tr>
            <tr>
                <td>rice</td>

            </tr>
            <tr>
                <td rowspan="2">Tuesday</td>
                <td>dall makhni</td>
                <td>daliya</td>
            </tr>
            <tr>
                <td>puri</td>

        </tbody>
    </table>

</body>

</html>
